<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SSD Vinted Assistant — Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../panel/panel.css">
  <style>
    body { max-width: 460px; margin: 0 auto; padding: 24px 16px; background: var(--vinted-bg); }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--vinted-border);
      border-radius: 8px;
      font-family: var(--vinted-font);
      font-size: 14px;
      background: var(--vinted-field);
    }
    .actions { margin-top: 18px; display: flex; gap: 8px; align-items: center; }
    #status { font-size: 13px; }
  </style>
</head>
<body>
  <header class="panel-header" style="padding-left: 0; padding-right: 0;">
    <span class="brand-mark">SSD</span>
    <div>
      <h1>Assistant settings</h1>
      <p class="subtitle">Where your Style Savvy Div app lives</p>
    </div>
  </header>

  <label for="appUrl">App URL</label>
  <input id="appUrl" type="url" placeholder="http://localhost:3000">

  <label for="apiToken">API token</label>
  <input id="apiToken" type="password" placeholder="From Rails credentials (extension.api_token)">

  <div class="actions">
    <button id="save" class="btn btn-primary">Save</button>
    <button id="test" class="btn btn-outline">Test connection</button>
    <span id="status"></span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
